services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'try { rs.status() } catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)'
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    environment:
      DATABASE_URL: mongodb://mongo:27017/clausebook?replicaSet=rs0&directConnection=true
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
